name: Export SB1 source backup
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          mkdir -p backup
          git archive --format=zip --output=backup/SB1-source-${GITHUB_SHA}.zip HEAD
          cat > backup/README-BACKUP.txt <<'EOF'
SB1 source backup.
Secrets are intentionally NOT included.
After restoring, create .env.local from .env.example and add Supabase/Vercel/Stripe/AI keys.
EOF
      - uses: actions/upload-artifact@v4
        with:
          name: SB1-source-backup
          path: backup/
          retention-days: 90
