name: SB1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Package full SB1 source
        run: zip -r SB1-complete-source.zip . -x '.git/*' 'node_modules/*' '.env' '.env.*'
      - name: Upload SB1 source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SB1-complete-source
          path: SB1-complete-source.zip
          retention-days: 30
