name: SB1 Source Archive
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -r sb1-source-main.zip . \
            -x ".git/*" "node_modules/*" "dist/*" ".vercel/*" "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: sb1-source-main
          path: sb1-source-main.zip
          retention-days: 90
