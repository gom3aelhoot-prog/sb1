name: SB1 specialty library news sync

on:
  schedule:
    - cron: '7 1,6,11,16,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-library:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout SB1
        uses: actions/checkout@v4
      - name: Refresh specialty library feed
        run: node scripts/sync-library-news.mjs
      - name: Commit refreshed library
        run: |
          git config user.name "SB1 Library Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/library-feed.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh SB1 specialty library"
          git push
