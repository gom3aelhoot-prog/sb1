name: SB1 Backup ZIP
on:
  push:
    branches: [main]
jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create backup
        run: |
          git archive --format=zip --output=SB1-complete-backup.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: SB1-complete-backup
          path: SB1-complete-backup.zip
          retention-days: 90
