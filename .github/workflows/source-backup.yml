name: SB1 source backup
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source ZIP
        run: |
          zip -r "sb1-source-${GITHUB_SHA}.zip" . -x ".git/*" "node_modules/*" "dist/*" ".vercel/*" "*.DS_Store"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sb1-source-${{ github.sha }}
          path: sb1-source-${{ github.sha }}.zip
          retention-days: 90
